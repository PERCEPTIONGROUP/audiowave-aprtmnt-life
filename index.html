:root{
  --bg:#0a0a0c;--bg2:#111115;--card:#16161b;--card2:#1e1e24;--line:rgba(237,239,247,.08);--line2:rgba(237,239,247,.16);
  --fg:#fafbff;--fg2:#d3d6e0;--mut:#9da2b3;--dim:#6e7180;--faint:#40424d;
  --s3:#ffc53d;--s2:#8fb8ff;--s1:#8a8e9c;
  --r:14px;--font:Manrope,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%;scroll-padding-top:250px}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;-webkit-tap-highlight-color:transparent}
svg{display:block;width:20px;height:20px;fill:currentColor;flex:none}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:8px}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
[hidden]{display:none!important}

.top{padding-top:max(28px,env(safe-area-inset-top));padding-bottom:16px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
h1{font-size:clamp(30px,8.4vw,52px);line-height:1.02;letter-spacing:-.025em;font-weight:800;margin:10px 0 12px;overflow-wrap:anywhere}
.facts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;color:var(--fg2);font-size:14px;font-weight:500}
.folder{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg);font-weight:600;font-size:13px;padding:6px 10px 6px 12px;border:1px solid var(--line2);border-radius:999px}
.folder svg{width:15px;height:15px}
.folder:hover{background:var(--card)}

.player{position:sticky;top:0;z-index:20;background:rgba(10,10,12,.95);-webkit-backdrop-filter:saturate(1.4) blur(18px);backdrop-filter:saturate(1.4) blur(18px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.deck{padding:8px 0 10px}
canvas{display:block;width:100%}
.detail{height:136px;touch-action:pan-y;cursor:grab;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.detail.drag{cursor:grabbing}
.overview{height:30px;margin-top:6px;touch-action:pan-y;cursor:pointer;border-radius:6px}
.ctl{display:flex;align-items:center;gap:6px;margin-top:10px}
.play{width:46px;height:46px;border-radius:50%;background:var(--fg);color:#0a0a0c;display:grid;place-items:center;flex:none;transition:transform .12s}
.play:active{transform:scale(.94)}
.play svg{width:22px;height:22px}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--fg2);flex:none}
.ib:hover{background:var(--card);color:var(--fg)}
.ib:disabled{opacity:.3;cursor:default;background:none}
.now{flex:1;min-width:0;text-align:left;padding:4px 8px;border-radius:10px;display:flex;flex-direction:column;gap:1px}
.now:hover{background:var(--card)}
.clock{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;font-weight:500}
.clock b{color:var(--fg);font-weight:700}
.nowline{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.nowline .st{margin:0 6px 0 4px;letter-spacing:1px}
.nowline .mut{color:var(--mut);font-weight:500}

.tools{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--mut)}
.search:focus-within{border-color:var(--line2);color:var(--fg)}
.search svg{width:18px;height:18px}
.search input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:var(--fg);font-size:16px}
.search input::placeholder{color:var(--dim)}
.search input::-webkit-search-cancel-button{filter:invert(.7)}
.countrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 12px}
.sortbtn{display:flex;align-items:center;gap:6px;height:34px;margin-right:-8px;padding:0 10px;border-radius:10px;font-size:13px;font-weight:700;white-space:nowrap;color:var(--fg2)}
.sortbtn svg{width:17px;height:17px}
.sortbtn:hover{background:var(--card);color:var(--fg)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.chip{height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.chip .st{letter-spacing:1px}
.chip small{font-size:12px;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums}
.chip[aria-checked=true]{background:var(--card2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.chip[aria-checked=true] small{color:var(--mut)}
.chip:disabled{opacity:.35;cursor:default}
.count{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
.card{display:block;text-decoration:none;border-radius:var(--r);outline-offset:3px}
.thumb{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease,opacity .3s;opacity:0}
.thumb img.ok{opacity:1}
.card:hover .thumb img{transform:scale(1.03)}
.thumb::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);pointer-events:none}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:800;color:var(--faint);background:radial-gradient(120% 90% at 50% 0%,#1e1e24,#111115)}
.tc{position:absolute;left:8px;bottom:8px;padding:3px 8px;border-radius:999px;background:rgba(10,10,12,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.live{position:absolute;left:8px;top:8px;display:none;align-items:center;gap:6px;padding:4px 9px 4px 8px;border-radius:999px;background:var(--c);color:#0a0a0c;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.live i{width:6px;height:6px;border-radius:50%;background:#0a0a0c;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.card.on .live{display:inline-flex}
.card.on .thumb{box-shadow:0 0 0 2px var(--c)}
.card.flash .thumb{animation:flash 1.1s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--c)}100%{box-shadow:0 0 0 0 transparent}}
.meta{padding:10px 2px 0}
.r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dn{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.stars{letter-spacing:1.5px;font-size:13px;white-space:nowrap;font-family:system-ui,-apple-system,sans-serif}
.stars .off{color:var(--faint)}
.ttl{font-size:15px;font-weight:700;line-height:1.3;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ttl.unk{color:var(--mut);font-weight:600}
.sub{font-size:13px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:48px 0;text-align:center;color:var(--mut)}
.empty button{margin-top:12px;padding:10px 16px;border-radius:10px;border:1px solid var(--line2);font-weight:600;color:var(--fg)}

.foot{margin-top:auto;padding:56px 16px max(32px,env(safe-area-inset-bottom));text-align:center;font-size:12px;font-weight:500;color:var(--dim);letter-spacing:.02em}

.lb{border:0;padding:0;margin:auto;background:transparent;color:var(--fg);max-width:none;max-height:none;width:100%;height:100%}
.lb::backdrop{background:rgba(5,5,7,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.lb[open]{animation:lbin .2s ease}
@keyframes lbin{from{opacity:0;transform:translateY(8px)}}
.lbin{height:100%;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);display:flex;flex-direction:column}
.lbmedia{position:relative;flex:none;display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top)) 12px 0;touch-action:pan-y}
.lbframe{position:relative;max-width:100%}
/* Zo hoog als het scherm toelaat met de knoppen er nog onder (ook op een kleine gsm). */
.lbmedia img,.lbph{display:block;height:clamp(240px,calc(100vh - 396px),640px);height:clamp(240px,calc(100dvh - 396px),640px);width:auto;max-width:100%;aspect-ratio:var(--ar,9/16);object-fit:cover;border-radius:16px;background:var(--card)}
.lbph{display:grid;place-items:center;font-size:64px;font-weight:800;color:var(--faint)}
.lbnav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(10,10,12,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;color:var(--fg)}
.lbnav.l{left:8px}.lbnav.r{right:8px}
.lbnav:disabled{opacity:0;pointer-events:none}
.lbinfo{padding:14px 16px max(20px,env(safe-area-inset-bottom));width:100%;max-width:560px;margin:0 auto}
.lbbar{position:fixed;z-index:2;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;pointer-events:none;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.lbbar>*{pointer-events:auto}
#lbpos{padding:6px 11px;border-radius:999px;background:rgba(10,10,12,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--fg2)}
.close{background:rgba(10,10,12,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:50%;color:var(--fg)}
.lbkick{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.lbkick .stars{font-size:15px}
.lb h2{font-size:24px;line-height:1.15;letter-spacing:-.015em;font-weight:800;margin-top:6px;overflow-wrap:anywhere}
.lb h2.unk{color:var(--fg2)}
.lbart{color:var(--mut);font-size:14px;margin-top:4px}
.lbfacts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.lbfacts div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.lbfacts dt{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.lbfacts dd{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
.lbbtns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:50px;border-radius:14px;border:1px solid var(--line2);font-size:15px;font-weight:700;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--card)}
.btn.primary{height:58px;background:var(--fg);color:#0a0a0c;border-color:var(--fg);font-size:17px}
.btn.primary:hover{background:#e6e8f0}
.btn.primary[aria-disabled=true]{background:var(--card);color:var(--dim);border-color:var(--line);cursor:default}
.btn.ghost{border-color:transparent;background:var(--card)}
.btn.ghost:hover{background:var(--card2)}
.btn small{font-weight:600;opacity:.6}

@media (min-width:560px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tools{flex-direction:row;align-items:center}
  .search{max-width:420px}
  .chips{display:flex}
  .chip{padding:0 14px}
}
@media (min-width:860px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 18px}
  .detail{height:176px}
  .overview{height:34px}
  html{scroll-padding-top:290px}
  .lb{width:min(980px,calc(100% - 48px));height:fit-content;max-height:calc(100% - 48px);border-radius:22px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 1px var(--line)}
  .lbin{flex-direction:row;height:auto;max-height:calc(100vh - 48px);background:var(--bg2)}
  .lbmedia{padding:20px;background:#000}
  .lbmedia img,.lbph{height:min(78vh,720px)}
  .lbinfo{padding:22px 28px 28px 8px;display:flex;flex-direction:column;max-width:none;flex:1;min-width:0}
  .lbbtns{margin-top:auto;padding-top:20px}
  .lbbar{position:static;margin:0 -10px 14px 0;color:var(--mut)}
  #lbpos{padding:0;background:none}
  .close{background:none}
  .lb h2{font-size:28px}
}
@media (min-width:1100px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function rr(ctx, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
var LANE = 18, LGAP = 3, RULER = 16;
function layout() { var top = D.lanes * (LANE + LGAP) + 6; return { top: top, bot: dc.h - RULER - 2 }; }

function drawDetail(t) {

  });

      ctx.beginPath(); ctx.moveTo(xd - 4, y + LANE); ctx.lineTo(xd + 4, y + LANE); ctx.lineTo(xd, y + LANE + 5); ctx.closePath(); ctx.fillStyle = col; ctx.fill();
    });

    var tw = ctx.measureText(txt).width;

function buildOverview() {
  var w = Math.max(1, Math.floor(oc.w)); ocols = new Float32Array(w);
  for (var x = 0; x < w; x++) {
    var i0 = Math.floor(x / w * NP), i1 = Math.max(i0 + 1, Math.floor((x + 1) / w * NP)), m = 0;

function drawOverview(t) {

// ------------------------------------------------ wat speelt er

  } else { line.appendChild(el('span', 'mut', clips.length ? 'Sleep de tijdlijn of tik op een clip' : 'Luister de hele set')); $('now').removeAttribute('aria-label'); }

$('now').onclick = function () { var b = $('now'); if (b._clip) openClip(b._clip, true); else if (b._next) go(b._next); };

// ------------------------------------------------ afspelen
var I_PLAY = $('play').innerHTML, I_PAUSE = "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"6.5\" y=\"5\" width=\"4\" height=\"14\" rx=\"1.2\"/><rect x=\"13.5\" y=\"5\" width=\"4\" height=\"14\" rx=\"1.2\"/></svg>";
function syncPlay() { var p = !au.paused; $('play').innerHTML = p ? I_PAUSE : I_PLAY; $('play').setAttribute('aria-label', p ? 'Pauzeren' : 'Afspelen'); }
au.addEventListener('play', syncPlay); au.addEventListener('pause', syncPlay);
au.addEventListener('seeked', function () { dirty = true; }); au.addEventListener('loadedmetadata', function () { dirty = true; });

}

  if (play !== false && au.paused) toggle();
}
function step(dir) {

  else { for (var j = list.length - 1; j >= 0; j--) if (list[j].start < t - 2) { target = list[j]; break; } }

$('prev').onclick = function () { step(-1); };
$('next').onclick = function () { step(1); };

// slepen op de grote tijdlijn (met een korte uitloop), tikken = naar die drop
var drag = null, glide = null;
detail.addEventListener('pointerdown', function (e) {
  if (e.button && e.button !== 0) return;
  glide = null;

});

// overzicht: tikken of slepen = daarheen
var odrag = null;
function overviewTime(e) { var r = overview.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width, 0, 1) * dur; }

// ------------------------------------------------ lightbox
var lb = $('lb'), cur = null, navOpened = false;
function lbList() { return visible.length && cur && cur._on ? visible : clips; }
function renderLb(c) {
  cur = c;
  var list = lbList(), idx = list.indexOf(c);
  $('lbpos').textContent = (idx + 1) + ' / ' + list.length;
  $('lbprev').disabled = idx <= 0; $('lbnext').disabled = idx < 0 || idx >= list.length - 1;
  var img = $('lbimg');
  $('lbmedia').style.setProperty('--ar', String(c.ar || 9 / 16));
  if (c.thumbBig || c.thumb) { img.hidden = false; $('lbph').hidden = true; img.src = c.thumbBig || c.thumb; }
  else { img.hidden = true; img.removeAttribute('src'); $('lbph').hidden = false; $('lbph').textContent = String(c.n); }
  $('lbdrop').textContent = label(c);
  var s = $('lbstars'); s.textContent = ''; s.appendChild(starsEl(c.stars));
  $('lbtitle').textContent = c.title; $('lbtitle').className = c.known ? '' : 'unk';
  $('lbart').textContent = c.artists; $('lbart').hidden = !c.artists;
  $('lbtime').textContent = fmt(c.time); $('lbbpm').textContent = c.bpm || '–'; $('lbdur').textContent = fmt(c.dur);
  var dl = $('lbdl'), view = $('lbview');
  if (c.download) { dl.href = c.download; dl.removeAttribute('aria-disabled'); $('lbdltxt').innerHTML = ''; $('lbdltxt').appendChild(document.createTextNode('Download ')); if (c.bytes) $('lbdltxt').appendChild(el('small', null, mb(c.bytes))); }

  else { dl.removeAttribute('href'); dl.setAttribute('aria-disabled', 'true'); $('lbdltxt').textContent = 'Nog niet op Dropbox'; }

  view.hidden = !(c.view && c.download); if (c.view) view.href = c.view;

  $('lbplaytxt').textContent = 'Speel in de set · ' + fmt(c.start);
  [list[idx - 1], list[idx + 1]].forEach(function (o) { if (o && (o.thumbBig || o.thumb)) { var im = new Image(); im.src = o.thumbBig || o.thumb; } });

  else { vid.pause(); vid.hidden = true; vid.removeAttribute('src'); vid.setAttribute('data-src', ''); }
}
function rawLink(u) {

  return u.replace(/([?&])dl=[01]/, '$1raw=1').replace(/([?&])raw=1(&raw=1)+/, '$1raw=1') + (/[?&]raw=1/.test(u.replace(/([?&])dl=[01]/, '$1raw=1')) ? '' : '&raw=1');
}
function openClip(c, push) {
  renderLb(c);
  var v0 = $('lbvid'); if (!v0.hidden) { try { $('au').pause(); } catch (e) {} var pr = v0.play(); if (pr && pr.catch) pr.catch(function () {}); }
  if (!lb.open) { if (lb.showModal) lb.showModal(); else lb.setAttribute('open', ''); document.documentElement.style.overflow = 'hidden'; }
  var h = '#drop-' + c.n;

}
function closeLb(fromHistory) {
  if (!lb.open) return;

  document.documentElement.style.overflow = '';
  if (!fromHistory) { if (navOpened) { navOpened = false; history.back(); } else history.replaceState(null, '', location.pathname + location.search); }
  else navOpened = false;

}
function lbStep(d) { var list = lbList(), i = list.indexOf(cur); var o = list[i + d]; if (o) { renderLb(o); history.replaceState(null, '', '#drop-' + o.n); } }
grid.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a.card'); if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault(); var n = +a.getAttribute('href').replace('#drop-', ''); if (byN[n]) openClip(byN[n], true);
});
$('lbclose').onclick = function () { closeLb(false); };
$('lbprev').onclick = function () { lbStep(-1); };
$('lbnext').onclick = function () { lbStep(1); };
$('lbplay').onclick = function () { var c = cur; closeLb(false); if (c) go(c, true); };
lb.addEventListener('cancel', function (e) { e.preventDefault(); closeLb(false); });
lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(false); });
var sw = null;
$('lbmedia').addEventListener('pointerdown', function (e) { sw = { x: e.clientX, y: e.clientY }; });
$('lbmedia').addEventListener('pointerup', function (e) { if (!sw) return; var dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) lbStep(dx < 0 ? 1 : -1); });
function fromHash() {
  var m = /^#drop-(\d+)$/.exec(location.hash), c = m && byN[+m[1]];
  if (c) { if (!lb.open || cur !== c) openClip(c, false); } else if (lb.open) closeLb(true);
}
window.addEventListener('popstate', function () { var m = /^#drop-(\d+)$/.exec(location.hash); if (!m && lb.open) closeLb(true); else fromHash(); });

// ------------------------------------------------ toetsen
document.addEventListener('keydown', function (e) {
  var tag = (e.target && e.target.tagName) || '';

  if (lb.open) {
    if (e.key === 'ArrowLeft') { lbStep(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { lbStep(1); e.preventDefault(); }
    return;
  }
  if (e.key === ' ' && tag !== 'BUTTON' && tag !== 'A') { toggle(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { seek(now() - (e.shiftKey ? 30 : 5), true); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { seek(now() + (e.shiftKey ? 30 : 5), true); e.preventDefault(); }
  else if (e.key === 'j' || e.key === 'J') step(-1);
  else if (e.key === 'k' || e.key === 'K') step(1);
  else if (e.key === '/') { $('q').focus(); e.preventDefault(); }
});

// vergrendelscherm en koptelefoonknoppen
if ('mediaSession' in navigator) {
  try {
    var art = clips.filter(function (c) { return c.thumbBig; }).sort(function (a, b) { return b.stars - a.stars || b.impact - a.impact; })[0];
    navigator.mediaSession.metadata = new MediaMetadata({ title: D.name, artist: 'DJ-set', album: D.date || '', artwork: art ? [{ src: new URL(art.thumbBig, location.href).href, sizes: '864x1536', type: 'image/jpeg' }] : [] });
    navigator.mediaSession.setActionHandler('previoustrack', function () { step(-1); });
    navigator.mediaSession.setActionHandler('nexttrack', function () { step(1); });
  } catch (e) {}
}

// ------------------------------------------------ lus
var lastT = -1, lastW = -1;
function frame() {

    scrub = clamp((scrub == null ? now() : scrub) + glide.v * dt, 0, dur); glide.v *= Math.pow(0.04, dt);

  }
  var t = now();
  if (t !== lastT || dirty || lastW !== dc.w) {

}

resize();
refilter();
fromHash();

requestAnimationFrame(frame);
})();
